<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doom's Decrees - Todo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
         
        <header class="text-center mb-4">
          <div class="mask" aria-hidden="true">&#9760;</div>
          <h3 id="date"></h3>
          <h1 class="title">DOOM'S TODO</h1>
          <p class="subtitle">"Bow before your tasks, for I am DOOM!"</p>
        </header>

        <form id="todo-form" class="input-group mb-3">
          <input id="todo-input" type="text" class="form-control" placeholder="Enter a new decree..." autocomplete="off" required>
          <button class="btn btn-doom" type="submit">Command</button>
        </form>

        <div class="btn-group w-100 mb-3" role="group" aria-label="Filter">
          <button class="btn btn-outline-doom active" data-filter="all">All</button>
          <button class="btn btn-outline-doom" data-filter="active">Pending</button>
          <button class="btn btn-outline-doom" data-filter="done">Conquered</button>
        </div>

        <ul id="todo-list" class="list-group"></ul>

        <p id="counter" class="text-center mt-3 footer-text"></p>
        <div class="text-center">
          <button id="clear-done" class="btn btn-sm btn-outline-doom">Banish conquered tasks</button>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
